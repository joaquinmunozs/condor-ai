name: Sincronizar ingreso de Silver & Co

# Silver & Co factura en guaraníes. Este workflow usa el script común de
# Shopify con --cliente silver; los tramos y la conversión contable se resuelven
# en Supabase.
#
# Los secretos ya creados se llaman SILVERANDCO_SHOPIFY_TIENDA y
# SILVERANDCO_SHOPIFY_TOKEN. Se exponen al script con el prefijo SILVER_
# que este espera internamente.
#
# Sin schedule por ahora: la primera ejecución debe ser manual y con
# “Solo informar” para validar ventas, moneda y acceso sin escribir asientos.

on:
  workflow_dispatch:
    inputs:
      meses:
        description: Cuántos meses hacia atrás revisar
        required: false
        default: "2"
      solo_informar:
        description: Solo mostrar la venta neta; no registrar comisiones
        type: boolean
        default: true

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Leer la venta de Silver & Co en Shopify
        run: |
          node services/ingresos-clientes/sincronizar-ingreso-tecnobox.mjs \
            --cliente silver \
            --meses "${{ inputs.meses || '2' }}" \
            ${{ inputs.solo_informar && '--dry-run' || '' }}
        env:
          SILVER_SHOPIFY_TIENDA: ${{ secrets.SILVERANDCO_SHOPIFY_TIENDA }}
          SILVER_SHOPIFY_TOKEN: ${{ secrets.SILVERANDCO_SHOPIFY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
